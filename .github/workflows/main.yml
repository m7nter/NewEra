name: Build SecureVault IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fix App Icon
        run: sips -z 1024 1024 Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build app
        run: |
          xcodebuild \
            -project SecureVault.xcodeproj \
            -scheme SecureVault \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" -path "*/Release-iphoneos/*.app" -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p ipa_output/Payload
          cp -R "$APP_PATH" ipa_output/Payload/
          cd ipa_output
          zip -qr ../SecureVault.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SecureVault-IPA
          path: SecureVault.ipa
